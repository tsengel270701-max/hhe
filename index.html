
<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Heart ❤️</title>
  <style>
    body {
      margin: 0;
      background: black;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
    }
    canvas {
      width: 90vw;
      max-width: 550px;
      height: auto;
    }
    h2 {
      color: pink;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="heart" width="600" height="550"></canvas>
  <h2>❤️ For You ❤️</h2>

  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    const colors = [
      "red", "blue", "lime", "yellow",
      "cyan", "magenta", "orange", "pink"
    ];

    let i = 0;
    const total = 500;

    function drawHeart() {
      if (i >= total) {
        i = 0;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      const t = (i / total) * Math.PI * 2;

      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t)
              - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t)
              - Math.cos(4 * t);

      const px = 300 + x * 15;
      const py = 270 - y * 15;

      ctx.fillStyle = colors[i % colors.length];
      ctx.beginPath();
      ctx.arc(px, py, 2.5, 0, Math.PI * 2);
      ctx.fill();

      i++;
      requestAnimationFrame(drawHeart);
    }

    drawHeart();
  </script>
</body>
</html>
